name: Deploy to Firebase Hosting on push
# A7: hosting deploy is now GATED — it runs only after the e2e + rules
# test jobs below pass. GitHub Actions cannot `needs:` across separate
# workflow files, so the tests run as jobs inside this workflow on push.
# (PRs are covered by functions-e2e.yml / rules-test.yml.)
on:
  push:
    branches: [ main ]
jobs:
  functions-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install test deps
        run: npm install --prefix tests
      - name: Install functions deps (needed for functions emulator)
        run: npm install --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run functions e2e on functions+firestore+auth emulator
        run: firebase emulators:exec --only functions,firestore,auth --project demo-bocean "node --test --test-concurrency=1 tests/spin.test.js tests/place.test.js tests/cancel.test.js tests/mission.test.js tests/prediction.test.js tests/courier.test.js tests/campaign.test.js tests/billing.test.js tests/productmeta.test.js"
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install test deps
        run: npm install --prefix tests
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run rules tests (emulator)
        run: firebase emulators:exec --only firestore --project demo-bocean "node --test tests/rules.test.js"
  deploy:
    needs: [ functions-e2e, rules-test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SA_PHUANSUAN }}
          channelId: live
          projectId: phuansuan

name: Functions e2e (lucky draw)

on:
  # push→main is covered by firebase-deploy.yml (which gates deploy on this
  # same suite); here we only need to gate pull requests.
  pull_request:

jobs:
  spin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install test deps
        run: npm install --prefix tests
      - name: Install functions deps (needed for functions emulator)
        run: npm install --prefix functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run functions e2e on functions+firestore+auth emulator
        run: firebase emulators:exec --only functions,firestore,auth --project demo-bocean "node --test --test-concurrency=1 tests/spin.test.js tests/place.test.js tests/cancel.test.js tests/mission.test.js tests/prediction.test.js tests/courier.test.js tests/campaign.test.js tests/billing.test.js tests/productmeta.test.js tests/tenant.test.js tests/dailybonus.test.js tests/aiplant.test.js"

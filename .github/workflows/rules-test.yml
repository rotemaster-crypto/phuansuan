name: Firestore rules tests (tenant isolation)

on:
  # push→main is covered by firebase-deploy.yml (which gates deploy on this
  # same suite); here we only need to gate pull requests.
  pull_request:

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install test deps
        run: npm install --prefix tests
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run rules tests (emulator)
        run: firebase emulators:exec --only firestore --project demo-bocean "node --test tests/rules.test.js"
